# Probes the production site after each Production deployment, once a day and on demand (P1-1c, design
# p1-step7-design.md §5.7 items 4-5): `pnpm live:check` (storyboard/scripts/live-check.ts) GETs the fixed
# production domain committed in that script, never a URL from the event, and expects what the committed
# PRODUCTION_LAUNCH says. Its log holds only paths, status codes, header names and pass/fail.
# Vercel sends repository_dispatch events only to a workflow on the default branch. Two Vercel projects
# share this repository; a probe started by the other project's event is harmless. The event payload is
# read only in the job's if: below, never inside a run: step (script injection).
name: live-check

on:
  repository_dispatch:
    types: [vercel.deployment.success, vercel.deployment.promoted]
  schedule:
    - cron: '23 5 * * *' # 05:23 UTC (10:53 IST), away from the top of the hour
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: storyboard

jobs:
  live-check:
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.environment == 'production'
    # One probe at a time, set on the job and not the workflow: a run whose job is skipped (a
    # Preview deployment's event) then never joins the group, and a probe in progress is never
    # cancelled; a newer run waits for it.
    concurrency:
      group: live-check
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: storyboard/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: storyboard/.nvmrc
          cache: pnpm
          cache-dependency-path: storyboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm live:check
