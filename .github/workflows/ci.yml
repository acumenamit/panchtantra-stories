name: ci

on:
  push:
    branches: [main]
    paths:
      - 'storyboard/**'
      - 'pt/src/stories/**' # legacy source: frozen-hash, conversion and waiver checks
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'storyboard/**'
      - 'pt/src/stories/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: storyboard

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: storyboard/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: storyboard/.nvmrc
          cache: pnpm
          cache-dependency-path: storyboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
        env:
          CONTENT_SOURCE: fixtures

  # P1-1c (design p1-step7-design.md §8.4) and P1-2c (design p1-step9-design.md §3.5, §10.4): three
  # builds of the reader launch flag. gated runs the Production code path (VERCEL_ENV=production,
  # CONTENT_SOURCE=none); review opens the reader with fixtures; staging serves the 3 fixtures as a
  # staging catalogue from a Storage stub on 127.0.0.1 and builds a simulated Preview with the
  # reader open and the staging banner on every page. Each leg has its own env: never a ternary
  # that yields '', because an empty VERCEL_ENV counts as set and refuses review, fixtures and the
  # staging harness. The staging step has no env block: the harness sets what it needs, refuses any
  # preset VERCEL*, CONTENT_* or READER_LAUNCH, and runs here because GitHub sets
  # GITHUB_ACTIONS=true. No leg's build output is uploaded or deployed (only the Playwright report,
  # on failure).
  e2e:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        launch: [gated, review, staging]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: storyboard/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: storyboard/.nvmrc
          cache: pnpm
          cache-dependency-path: storyboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build (gated, Production code path)
        if: matrix.launch == 'gated'
        run: pnpm build
        env:
          CONTENT_SOURCE: none
          VERCEL_ENV: production
      - name: Build (review)
        if: matrix.launch == 'review'
        run: pnpm build
        env:
          CONTENT_SOURCE: fixtures
          READER_LAUNCH: review
      - name: 'Build (staging: content from a local Storage stub on 127.0.0.1, simulated Preview)'
        if: matrix.launch == 'staging'
        run: pnpm exec tsx scripts/testing/staging-build.ts
      - run: pnpm test:e2e
        env:
          E2E_LAUNCH: ${{ matrix.launch }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.launch }}
          path: storyboard/playwright-report
          retention-days: 7
